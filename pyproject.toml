[project]
name = "item-organizer"
version = "0.1.0"
description = "A simple backlog and assignment tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "psycopg2>=2.9.12",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "coverage>=7.16.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = [
    "**/__init__.py",
    "tests/*",
]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if __name__ == .__main__.:",
]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/configuration/

[tool.ruff]
