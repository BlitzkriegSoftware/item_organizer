[project]
name = "item-organizer"
version = "0.1.0"
description = "A simple backlog and assignment tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "cryptography>=50.0.1",
    "cryptography-fernet>=0.1.0",
    "encryption>=0.0.1",
    "fastapi[standard]>=0.141.1",
    "psycopg2>=2.9.12",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
    "python-json-logger>=4.2.0",
    "sqlalchemy>=2.0.52",
    "varname>=1.0.0",
]

[dependency-groups]
dev = [
    "coverage>=7.16.0",
    "faker>=40.38.0",
    "hatchling>=1.32.0",
    "pytest>=9.1.1",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-conestack-theme>=1.1.1",
    "sphinx-markdown-builder>=0.6.11",
    "sphinx-new-tab-link>=0.8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/app_exceptions",
    "src/app_logger",
    "src/biz_logic",
    "src/common_helpers",
    "src/data_lib", 
    "src/item_organizer", 
    "src/security_lib"
]

#[project.scripts]
#item-organizer = "item_organizer.main:main"
[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

filterwarnings = [
    "ignore::DeprecationWarning: pythonjsonlogger.*"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "**/__init__.py",
    "tests/*",
]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if __name__ == .__main__.:",
]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/configuration/

[tool.ruff]
